services:
  panel:
    build: .
    ports:
      - "127.0.0.1:${MC_HOST_PANEL_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      MC_HOST_DATA_DIR: /var/lib/open-mc-host
      MC_HOST_DOCKER_DATA_DIR: ${MC_HOST_HOST_DATA_DIR:-/var/lib/open-mc-host}
      MC_HOST_IMAGE: ${MC_HOST_IMAGE:-itzg/minecraft-server:java25}
      MC_HOST_API_TOKEN: ${MC_HOST_API_TOKEN}
      MC_HOST_PUBLIC_HOST: ${MC_HOST_PUBLIC_HOST:-}
      MC_HOST_DASHBOARD_URL: ${MC_HOST_DASHBOARD_URL:-}
      MC_HOST_LAN_IP: ${MC_HOST_LAN_IP:-}
      MC_HOST_NETWORK_MODE: ${MC_HOST_NETWORK_MODE:-auto}
      MC_HOST_PORT_RANGE: ${MC_HOST_PORT_RANGE:-25565-25575}
      MC_HOST_MAX_UPLOAD_MB: ${MC_HOST_MAX_UPLOAD_MB:-250}
      MC_HOST_AUTO_BACKUP_ENABLED: ${MC_HOST_AUTO_BACKUP_ENABLED:-true}
      MC_HOST_AUTO_BACKUP_HOUR: ${MC_HOST_AUTO_BACKUP_HOUR:-3}
    volumes:
      - ${MC_HOST_HOST_DATA_DIR:-/var/lib/open-mc-host}:/var/lib/open-mc-host
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
